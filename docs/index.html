<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CAL FIRE Structure Data</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQjEYl8Pbb9GgbLj8C3hH6pZm5x9i/E="
      crossorigin=""
    >
    <link rel="stylesheet" href="styles.css?v=histogram">
  </head>
  <body>
    <main class="figure" data-display="table" aria-label="CAL FIRE structure data dashboard">
      <section class="panel map-panel">
        <h1 id="map-title">california fire</h1>
        <div id="map"></div>
      </section>

      <section class="panel damage-controls" aria-label="damage filters">
        <div id="damage-filters"></div>
      </section>

      <div id="damage-legend" class="chart-legend"></div>

      <section class="panel pie-panel">
        <h2>damage distribution</h2>
        <canvas id="damage-chart"></canvas>
      </section>

      <section class="panel sampling-panel">
        <h2>sampling dates</h2>
        <canvas id="sampling-chart"></canvas>
      </section>

      <section class="panel year-built-panel">
        <h2>year built</h2>
        <div class="year-built-layout">
          <div class="year-built-chart-frame">
            <canvas id="year-built-chart"></canvas>
          </div>
          <div class="year-built-stats">
            <div>unspecified:<br><span id="year-built-unspecified">0</span></div>
            <div>out of range:<br><span id="year-built-out-of-range">0</span></div>
          </div>
        </div>
      </section>

      <nav id="display-buttons" class="display-buttons" aria-label="display mode">
        <button type="button" data-display="table">table</button>
        <button type="button" data-display="bar chart">bar chart</button>
      </nav>

      <section class="panel combustibility-panel table-view">
        <h2>combustibility</h2>
        <div id="combustibility-table" class="table-host compact-table"></div>
      </section>

      <section class="panel material-table-panel table-view">
        <h2>structural composition and material</h2>
        <div id="material-table" class="table-host"></div>
      </section>

      <section class="panel combustibility-bar-panel chart-view">
        <h2>combustibility</h2>
        <canvas id="combustibility-chart"></canvas>
      </section>

      <section class="panel material-bar-panel chart-view">
        <h2>structural composition and material</h2>
        <canvas id="material-chart"></canvas>
      </section>

      <section class="panel feature-panel eaves-panel table-view">
        <div id="eaves-table" class="table-host mini-table"></div>
      </section>

      <section class="panel feature-panel ventscreen-panel table-view">
        <div id="ventscreen-table" class="table-host mini-table"></div>
      </section>

      <section class="panel feature-panel windowpane-panel table-view">
        <h2>building properties</h2>
        <div id="windowpane-table" class="table-host mini-table"></div>
      </section>

      <section class="panel feature-chart-panel eaves-chart-panel chart-view">
        <h3>eaves</h3>
        <canvas id="eaves-chart"></canvas>
      </section>

      <section class="panel feature-chart-panel ventscreen-chart-panel chart-view">
        <h3>mesh screen</h3>
        <canvas id="ventscreen-chart"></canvas>
      </section>

      <section class="panel feature-chart-panel windowpane-chart-panel chart-view">
        <h2>building properties</h2>
        <h3>window pane</h3>
        <canvas id="windowpane-chart"></canvas>
      </section>

      <nav id="fire-buttons" class="fire-buttons" aria-label="fire selection"></nav>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script src="config.js"></script>
    <script src="extract_data.js"></script>
    <script src="plot.js"></script>
    <script src="app.js"></script>
  </body>
</html>
